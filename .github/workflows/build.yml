name: Build and Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install Semgrep
        shell: bash
        run: python -m pip install --no-cache-dir semgrep

      - name: Run Semgrep SAST
        shell: bash
        run: make sast

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        run: make install-frontend

      - name: Build Frontend
        run: make build-frontend

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.24'
          cache: true

      - name: Install Backend Dependencies
        run: make install-backend

      - name: Run Backend Tests
        run: make test-backend

      - name: Build Backend Binary
        run: make build-backend

  build-and-push:
    name: Build & Push Container Image
    needs: [sast, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      release-tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Choose next release version
        id: release
        if: github.ref == 'refs/heads/main'
        run: |
          code_paths=(
            ':(glob)cmd/**/*.go' ':(glob)internal/**/*.go' ':(glob)web/src/**' ':(glob)web/public/**'
            'web/index.html' 'web/web.go' 'assets/icon.svg'
            ':(exclude,glob)**/*_test.go' ':(exclude,glob)web/src/**/*.test.*' ':(exclude,glob)web/src/**/*.spec.*' ':(exclude,glob)web/src/**/__tests__/**'
          )
          image_paths=(
            Dockerfile Makefile go.mod go.sum
            web/package.json web/package-lock.json web/tsconfig.json web/vite.config.ts
            "${code_paths[@]}"
          )
          latest=$(git tag --sort=-version:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found++ { print }')
          if ! git merge-base --is-ancestor "$latest" HEAD; then
            exit 0
          fi
          # Promote the release to 1.0.0 once, then resume automatic bumps.
          if [[ "${latest%%.*}" == v0 ]]; then
            echo 'tag=v1.0.0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$latest" HEAD -- "${image_paths[@]}")
          if [[ -z "$changed" ]]; then
            exit 0
          fi

          code_changes=$(git diff --name-only "$latest" HEAD -- "${code_paths[@]}")
          series=${latest%.*}
          if [[ -n "$code_changes" ]]; then
            minor=${series##*.}
            echo "tag=${series%.*}.$((10#$minor + 1)).0" >> "$GITHUB_OUTPUT"
          else
            patch=${latest##*.}
            echo "tag=$series.$((10#$patch + 1))" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: github.event_name == 'pull_request' || steps.release.outputs.tag != ''
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Log in to GitHub Container Registry
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || steps.release.outputs.tag != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        if: github.event_name == 'pull_request' || steps.release.outputs.tag != ''
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}

      - name: Build and push container image
        if: github.event_name == 'pull_request' || steps.release.outputs.tag != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.release.outputs.tag != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.release.outputs.tag || 'dev' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && format('type=registry,ref={0}/{1}:buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}

  create-release:
    name: Create GitHub Release
    needs: build-and-push
    if: needs.build-and-push.outputs.release-tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-and-push.outputs.release-tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
