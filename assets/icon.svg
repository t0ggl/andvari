<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="andvariBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="andvariRing" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="andvariGold" x1="28" y1="35" x2="36" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background Vault Plaque -->
  <rect width="64" height="64" rx="14" fill="url(#andvariBg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Vault Lock Ring (Andvaranaut) with 3 indexing keyways -->
  <circle cx="32" cy="32" r="21.5" stroke="url(#andvariRing)" stroke-width="3.5" stroke-dasharray="19 5 14 5 26 5" stroke-linecap="round"/>

  <!-- Inner faceted vault aperture -->
  <polygon points="32,18 43,24.5 43,37.5 32,44 21,37.5 21,24.5" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" fill="#030712" fill-opacity="0.75"/>

  <!-- Monogram chevron 'A' -->
  <path d="M32 21L40 37H35L32 30.5L29 37H24L32 21Z" fill="url(#andvariRing)"/>

  <!-- Golden Ring / Andvaranaut Core Treasure -->
  <circle cx="32" cy="38" r="2.5" fill="url(#andvariGold)"/>
</svg>
